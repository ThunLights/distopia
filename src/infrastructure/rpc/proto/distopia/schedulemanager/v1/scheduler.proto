syntax = "proto3";

package distopia.schedulemanager.v1;

// Implemented by presentation-web and called by presentation-schedulemanager after its own
// 20-minute jobs. Those jobs run in schedulemanager itself; this only refreshes the read
// caches web keeps in process memory (ranking, root page, friends), which no other process can.
service SchedulerService {
  rpc RefreshCaches(RefreshCachesRequest) returns (RefreshCachesResponse);
}

message RefreshCachesRequest {}
message RefreshCachesResponse {}
