syntax = "proto3";

package distopia.schedulemanager.v1;

// Implemented by presentation-web (which still hosts AppCore + the Discord client) and called
// by presentation-schedulemanager on a node-cron tick -- see setSchedulerRpcServer.ts and
// presentation-schedulemanager/src/index.ts.
service SchedulerService {
  rpc RunFiveMinuteTasks(RunFiveMinuteTasksRequest) returns (RunFiveMinuteTasksResponse);
  rpc RunTwentyMinuteTasks(RunTwentyMinuteTasksRequest) returns (RunTwentyMinuteTasksResponse);
  // Runs every src/application/feature/* "./schedule" task registered under `cron`.
  rpc RunFeatureTasks(RunFeatureTasksRequest) returns (RunFeatureTasksResponse);
}

message RunFiveMinuteTasksRequest {}
message RunFiveMinuteTasksResponse {}

message RunTwentyMinuteTasksRequest {}
message RunTwentyMinuteTasksResponse {}

message RunFeatureTasksRequest {
  string cron = 1;
}
message RunFeatureTasksResponse {}
