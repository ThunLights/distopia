name: Help

# Builds the VitePress help site (src/presentation/help) on every relevant PR as a check, and
# on push to main publishes it to the gh-pages branch root (served as docs.distopia.top via
# docs/public/CNAME). gh-pages also holds Storybook PR previews under storybook/ (see
# preview.yml), so the deploy below replaces everything EXCEPT storybook/ and .git, and
# preview.yml no longer cleans the branch root.
on:
  push:
    branches:
      - main
    paths:
      - "src/presentation/help/**"
      - ".github/workflows/help.yml"
  pull_request:
    paths:
      - "src/presentation/help/**"
      - ".github/workflows/help.yml"
  workflow_dispatch:

env:
  PUBLIC_BOT_ID: ${{ vars.PUBLIC_BOT_ID || '1505544379639660745' }}

jobs:
  build:
    name: build help
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run docs:build
        working-directory: src/presentation/help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: help-output
          path: src/presentation/help/docs/.vitepress/dist/
          retention-days: 1

  deploy:
    name: deploy help
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    concurrency:
      group: gh-pages-help-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: help-output
          path: tmp/help/

      - name: Replace site (keep storybook previews)
        run: |
          find . -maxdepth 1 -mindepth 1 \
            ! -name 'storybook' \
            ! -name '.git' \
            ! -name 'tmp' \
            -exec rm -rf {} +
          mv tmp/help/* .
          touch .nojekyll
          rm -rf tmp

      - name: Commit changes to gh-pages branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Deploy help site (${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git pull --rebase origin gh-pages && git push origin gh-pages && exit 0
            sleep $((i * 3))
          done
          exit 1
