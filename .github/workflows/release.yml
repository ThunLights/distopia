name: Release

on:
  pull_request:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Node Modules Cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Checkout nodejs
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install Deps
        run: bun ci

      - name: Install tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          git clone https://github.com/gitleaks/gitleaks.git "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks" && make build
          sudo mv gitleaks /usr/local/bin
          sudo curl -o /usr/local/bin/jq -L https://github.com/stedolan/jq/releases/download/jq-1.8.2/jq-linux64 && sudo chmod +x /usr/local/bin/jq

      - name: Check tools
        run: |
          which trufflehog
          which gitleaks
          which jq

      - name: Version script
        if: github.event_name == 'pull_request'
        # changeset version (CLI v3) now exits 1 when there are no unreleased changesets --
        # normal for a PR that doesn't add one (see CLAUDE.md) -- so only run version:jsr
        # when there was actually something to version, instead of failing every PR. `turbo`
        # must go through `bunx` here (unlike `bun run build` etc. elsewhere in this repo's
        # scripts, which get node_modules/.bin on PATH for free) since this step is a raw
        # shell script, not a `bun run <script>` invocation.
        run: |
          if npx changeset version; then
            bunx turbo run version:jsr
          fi

      - name: Create Tag
        if: github.event_name == 'push'
        run: |
          npx changeset git-tag
          git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Pull Request
        if: github.event_name == 'push'
        uses: changesets/action@v2
        with:
          version-script: npm run version
          github-token: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: npmjs.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Node Modules Cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Checkout nodejs
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Update NPM
        run: npm i -g npm@11.18.0

      - name: Install Deps
        run: bun ci

      # Via the root turbo build (not `cd lib/distopia && bun run build`) so turbo's own
      # `^build` dependency graph builds infra-rpc (buf generate -> src/gen/) first --
      # distopia's src/rpc.ts imports from there via the $infra-rpc/* tsconfig path alias,
      # which tsdown/rolldown only resolves once that generated code actually exists on disk.
      - name: Build
        run: bun run build -- --filter=distopia

      - name: Publish
        continue-on-error: true
        id: publish
        run: scripts/npm-publish.sh ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
        env:
          NPM_TOKEN: ''

      - name: Dump npm debug log
        if: steps.publish.outcome == 'failure'
        run: |
          cat /home/runner/.npm/_logs/*-debug-0.log || true
          exit 1

  jsr:
    name: jsr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Node Modules Cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Checkout nodejs
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Update NPM
        run: npm i -g npm@11.18.0

      - name: Install Deps
        run: bun ci

      # See the npm job's own comment on this step -- same reason.
      - name: Build
        run: bun run build -- --filter=distopia

      - name: Publish
        working-directory: ./lib/distopia
        run: npx jsr publish ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
