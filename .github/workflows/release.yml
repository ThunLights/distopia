name: Release

on:
  pull_request:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # On main, changesets/action either opens/updates the "Version Packages" PR (pending
  # changesets) or, once that PR is merged, runs `changeset publish` (npm + git tag + GitHub
  # Release), followed by the JSR publish. On a PR, both registries are only dry-run.
  release:
    name: Changesets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # Tags are needed so `changeset git-tag` skips versions that are already tagged.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Node Modules Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Checkout nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      # npm >= 11.5 for trusted publishing (OIDC) -- no NPM_TOKEN secret exists.
      - name: Update NPM
        run: npm i -g npm@11.18.0

      - name: Install Deps
        run: bun ci

      # Via the root turbo build (not `cd lib/distopia && bun run build`) so turbo's own
      # `^build` dependency graph builds infra-rpc (buf generate -> src/gen/) first --
      # distopia's src/rpc.ts imports from there via the $infra-rpc/* tsconfig path alias,
      # which tsdown/rolldown only resolves once that generated code actually exists on disk.
      - name: Build
        run: bun run build -- --filter=distopia

      # changeset version (CLI v3) exits 1 when there are no unreleased changesets -- normal
      # for a PR that doesn't add one -- so only run version:jsr when it versioned something.
      - name: Check versioning
        if: github.event_name == 'pull_request'
        run: |
          if npx changeset version; then
            bunx turbo run version:jsr
          fi

      # `npm pack`, not `npm publish --dry-run`: the latter rejects an already-published version.
      - name: Dry-run npm
        if: github.event_name == 'pull_request'
        working-directory: ./lib/distopia
        run: npm pack --dry-run

      # --allow-dirty: "Check versioning" has just rewritten versions/changelogs.
      - name: Dry-run JSR
        if: github.event_name == 'pull_request'
        working-directory: ./lib/distopia
        run: npx jsr publish --dry-run --allow-dirty

      # v2 commits the version PR and pushes tags through the GitHub API (no local commit, so
      # the husky hook never runs here). `changeset publish` skips versions already on npm,
      # publishes the rest via trusted publishing (OIDC, provenance included), and reports the
      # new tags through CHANGESETS_OUTPUT so the action pushes them and creates the Releases.
      - name: Version PR or publish to npm
        id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          publish-script: npx changeset publish
          create-github-releases: true

      # Runs on every push with no pending changesets, not only when npm published something,
      # so a failed JSR publish is retried on the next push; jsr skips an existing version.
      - name: Publish to JSR
        if: github.event_name == 'push' && steps.changesets.outputs.has-changesets == 'false'
        working-directory: ./lib/distopia
        run: npx jsr publish
