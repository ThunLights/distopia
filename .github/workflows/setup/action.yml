name: Setup

description: Setup for distopia

inputs:
  ref:
    description: Git ref to check out (defaults to the triggering event's ref/sha)
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false
        allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

    - name: Generate .env
      shell: bash
      run: printenv > .env

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build with GHA cache
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./docker
        push: false
        load: true
        cache-from: type=gha
        # mode=min, not max: max additionally exports the layers of intermediate build stages
        # that the final image discards, and docker/dockerfile is single-stage (one FROM), so
        # there are none -- every layer is already in the final image and exported either way.
        # The extra entries max produced just consumed the repository-wide 10 GB cache budget,
        # which is what makes buildx fail with "failed to reserve cache". (docker/
        # dockerfile.prod IS multi-stage, but deploy.yml builds it without any GHA cache, so
        # this setting never applied to it.)
        # A pull_request_target run executes fork code in this repo's cache scope -- it must only
        # read caches, never write ones that later trusted runs on main would restore.
        cache-to: ${{ github.event_name != 'pull_request_target' && 'type=gha,mode=min' || '' }}

    - name: Cache Bun install
      if: github.event_name != 'pull_request_target'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/bun/install
        key: ${{ runner.os }}-bun-install-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-install-

    - name: Restore Bun install cache (read-only for fork PRs)
      if: github.event_name == 'pull_request_target'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/bun/install
        key: ${{ runner.os }}-bun-install-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-install-

    - name: Cache Turbo
      if: github.event_name != 'pull_request_target'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Restore Turbo cache (read-only for fork PRs)
      if: github.event_name == 'pull_request_target'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Checkout Container
      working-directory: ./docker/
      shell: bash
      run: |
        docker volume create distopia-db-store
        docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
