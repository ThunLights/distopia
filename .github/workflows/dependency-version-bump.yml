name: Scheduled Dependency Version Bump

# Runs /bump-version + /open-pr (see .claude/commands/) on a schedule to keep
# pinned dependency versions (package.json, workspaces.catalog, packageManager,
# lib/distopia/jsr.json, docker/dockerfile ARGs, workflow bun-version pins — see
# the "Dependency Version Pins" table in CLAUDE.md) up to date. Dependabot does
# not track `catalog:` entries, so this is the only automated coverage for them.
#
# All packages bumped in a run land in a single branch/PR (not one PR per
# package) — separate PRs from the same run all touch bun.lock and conflict
# with each other as soon as the first one merges.
#
# Requires repo secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN, swap the
# input below) with access to the Anthropic API.

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:

concurrency: ${{ github.workflow }}

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup git identity
        run: |
          git config --global user.name "claude[bot]"
          git config --global user.email "claude[bot]@users.noreply.github.com"

      - name: Checkout nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install Deps
        run: bun ci

      # .husky/pre-commit runs trufflehog + gitleaks; install them here so
      # commits made by the action below don't fail the hook. Pinned to the
      # same versions as docker/dockerfile's TRUFFLEHOG_VERSION / GITLEAKS_VERSION
      # ARGs (not `main`) — see the Dependency Version Pins table in CLAUDE.md.
      - name: Install commit-hook tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/v3.96.0/scripts/install.sh | sh -s -- -b /usr/local/bin
          git clone -b v8.30.1 --depth 1 https://github.com/gitleaks/gitleaks.git "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks" && make build
          sudo mv gitleaks /usr/local/bin

      - name: Run Claude dependency bump
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools
            'Edit,MultiEdit,Write,Read,Glob,Grep,Bash(git:*),Bash(bun:*),Bash(gh:*),Bash(grep:*),Bash(rg:*)'
            --max-turns 180
          prompt: |
            Repository: ${{ github.repository }}
            Default branch: main

            You are running directly on an ephemeral GitHub Actions runner, NOT inside the
            project's devcontainer. Passwordless sudo is already available here and bun/git/gh
            are already on PATH, so ignore any instruction in .claude/commands/ or CLAUDE.md to
            wrap commands in `docker compose exec app ...` — run the plain command instead
            (e.g. `bun install` not `docker compose exec app sudo bun install`,
            `bun run typecheck` not `docker compose exec app sudo bun run typecheck`). Every
            other instruction in those files still applies as written.

            IMPORTANT: bundle every bump from this run into a SINGLE branch and a SINGLE
            pull request. Do not create one branch/PR per package — separate same-run PRs
            all touch `bun.lock` (and often the same `package.json`/`jsr.json` keys), so
            merging one immediately puts the others in conflict with `main`, exactly what
            happened with #155/#156 previously. One PR per scheduled run avoids that.

            Task:
            1. Before doing anything else, check whether a batch PR from an earlier run is
               still open: `gh pr list --state open --limit 1000 --json headRefName,url --jq
               '.[] | select(.headRefName | startswith("chore/deps-bump-"))'` (`gh pr list`
               defaults to only the 30 most recent PRs, which could miss an older batch PR
               and let a conflicting second batch through). If one exists,
               stop here and end cleanly — let that PR merge or close first rather than
               stacking a second batch of lockfile changes on top of it.
            2. Run `bun outdated` at the repo root, and separately in
               `src/presentation/web` (for packages like `@sveltejs/kit` and `playwright`
               that aren't in `workspaces.catalog`), to see what has newer versions available.
            3. Pick at most 3 outdated packages to act on this run. Prefer the shared
               `workspaces.catalog` / tooling packages (bun, oxfmt, oxlint, typescript,
               vitest, zod, discord.js, @types/node) since Dependabot does not track
               `catalog:` entries and nothing else surfaces them. Skip any package where the
               available update crosses a major version boundary — leave those for manual
               review. If nothing qualifies, do nothing and end here.
            4. Create one branch off a clean `main` for the whole batch:
               `git checkout main && git checkout -b chore/deps-bump-<run-id>` (use
               `${{ github.run_id }}` for `<run-id>`).
            5. For each chosen package, in that same branch, follow the version-file edits
               from `/bump-version <package> <new-version>` in
               `.claude/commands/bump-version.md` — i.e. update every pin location for that
               package — but do NOT run its own `bun install` or verification yet; apply the
               edits for all chosen packages first.
            6. Once every package's pin locations are updated, run `bun install` ONCE to
               refresh `bun.lock` for the whole batch, then verify once with
               typecheck/lint/build. If that combined verification fails, you cannot assume
               which package caused it — isolate it deterministically instead of guessing:
               revert one candidate package's pin-location edits, run `bun install` again to
               refresh the lockfile, and rerun typecheck/lint/build. If it now passes, that
               reverted package was (at least one) cause — leave it out and, if more than one
               package remains, repeat the same one-at-a-time revert-and-verify loop on the
               rest before concluding they're clean. If it still fails, put that package's
               edits back, revert a different candidate instead, and continue until
               verification passes or every package has been tried alone. Keep every package
               whose removal was never required to make verification pass; note every
               dropped package and why in the final summary. If nothing survives (removing
               each package one at a time never gets verification to pass), discard the
               branch and end without opening a PR.
            7. Follow the `/open-pr` instructions in `.claude/commands/open-pr.md` to commit
               (message: `chore(deps): bump N packages` listing each `<package>
               <old-version> -> <new-version>` on its own line) and open ONE PR against
               `main` titled `chore(deps): scheduled dependency bump` (or, if only one
               package survived, `chore(deps): bump <package> to <new-version>`),
               summarizing every package bumped and every file touched.
