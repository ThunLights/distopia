name: Deploy

# Builds the production image and pushes it to ghcr.io on every push to main. That's the
# whole job -- nothing here touches the cluster. Argo CD Image Updater (see
# k8s/argocd/app-app.yaml's annotations) polls ghcr.io directly and rolls distopia-app to
# whichever <epoch>-<short-sha> tag sorts highest; k8s/app/deployment.yaml's initContainer
# runs the real migration against the actual production database right before the new Pod's
# main container starts. See k8s/README.md's "Shipping a new build" for the full flow.
on:
  push:
    branches:
      - main
  # Lets `gh workflow run deploy.yml --ref main` (see k8s/README.md's bootstrap section and
  # the `argo` skill) actually start a run -- GitHub refuses a manual dispatch on a workflow
  # that only declares `push`, regardless of ref.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a run that might already be mid-push -- a half-pushed tag is worse than a
  # slightly delayed one. Two pushes landing close together just produce two tags; Image
  # Updater's alphabetical strategy (see app-app.yaml's own comment) picks the right one
  # regardless of which build finishes last.
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # A throwaway database to migrate and introspect at build time (infra-database's build
    # step, `prisma generate --sql`, needs a real already-migrated database, not just the
    # schema files -- see docker/dockerfile.prod's own comment) -- never the real production
    # database, which isn't reachable from a GitHub-hosted runner in the first place (see
    # k8s/README.md's "Cloudflare Tunnel and network exposure": nothing in the cluster binds
    # a public port).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: distopia
          POSTGRES_PASSWORD: distopia
          POSTGRES_DB: distopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distopia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://distopia:distopia@localhost:5432/distopia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Apply database migrations
        run: |
          bun install --frozen-lockfile
          cd src/infrastructure/database
          bunx prisma migrate deploy

      - name: Compute image tags
        id: tag
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build-time-only .env (see docker/dockerfile.prod's own comment) -- just DATABASE_URL.
      # No Sentry secret is needed here at all: SENTRY_ORG/SENTRY_PROJECT/SENTRY_AUTH_TOKEN
      # (sourcemap upload) are only used when present (vite.config.ts's
      # `autoUploadSourceMaps: !!process.env.SENTRY_AUTH_TOKEN` skips upload cleanly when
      # they're absent, rather than failing the build), and PUBLIC_SENTRY_DSN was never a
      # build-time value in the first place -- it's read via $env/dynamic/public at request
      # time (hooks.client.ts/instrumentation.server.ts). This deliberately does NOT reuse
      # ci.yml's secrets.SENTRY_AUTH_TOKEN -- that token and its "distopia-ci" project are
      # scoped to CI, not production releases; if production sourcemap upload is wanted
      # later, add this job's own SENTRY_ORG/SENTRY_PROJECT/SENTRY_AUTH_TOKEN env entries
      # from dedicated repo secrets rather than borrowing CI's. App runtime secrets
      # (BOT_TOKEN, PUBLIC_*) are never written here -- see k8s/app/deployment.yaml, they're
      # injected live into the Pod, never baked into the image.
      #
      # --network host (not docker/build-push-action's buildx, which builds in an isolated
      # network namespace by default) so the build can actually reach the postgres service
      # container on localhost -- same reasoning, same flag, as ci.yml's E2E job.
      - name: Build and push production image
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          EOF

          image_epoch_sha="ghcr.io/thunlights/distopia:${{ steps.tag.outputs.epoch }}-${{ steps.tag.outputs.sha }}"
          image_latest="ghcr.io/thunlights/distopia:latest"

          docker build --network host -f docker/dockerfile.prod \
            --build-arg GIT_SHA="${{ steps.tag.outputs.sha }}" \
            -t "$image_epoch_sha" -t "$image_latest" .
          rm -f .env

          docker push "$image_epoch_sha"
          docker push "$image_latest"
