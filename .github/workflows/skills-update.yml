name: Scheduled Skills Update

# Keeps agent skills installed via `bunx skills` (see skills-lock.json, .agents/skills/,
# .claude/skills/) in sync with their upstream sources -- e.g. hallmark
# (https://github.com/nutlope/hallmark). Dependabot has no notion of these; `bunx skills update`
# is the tool's own update mechanism (it reads skills-lock.json, re-fetches each skill's source,
# and refreshes the installed copy only when the upstream content hash actually changed).
# `skills` is pinned in the root package.json devDependencies -- `bunx skills` resolves that
# exact version from bun.lock rather than always fetching npm's `latest` the way `npx skills`
# would.
#
# No package-picking judgment is needed here (unlike dependency-version-bump.yml), so this runs
# the update directly instead of going through the Claude Code action -- opens a PR only when
# `bunx skills update` actually changed something.

on:
  schedule:
    - cron: "0 4 * * 1" # every Monday 04:00 UTC (1h after the dependency version bump)
  workflow_dispatch:

concurrency: ${{ github.workflow }}

jobs:
  skills-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup git identity
        run: |
          git config --global user.name "claude[bot]"
          git config --global user.email "claude[bot]@users.noreply.github.com"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install deps
        run: bun ci

      - name: Install commit-hook tools
        run: scripts/ci/install-commit-hook-tools.sh

      - name: Check for an already-open update PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --state open --limit 1000 --json headRefName,url \
            --jq '[.[] | select(.headRefName | startswith("chore/skills-update-"))][0].url // ""')
          echo "url=$existing" >> "$GITHUB_OUTPUT"

      - name: Run bunx skills update
        if: steps.existing-pr.outputs.url == ''
        run: bunx skills update -y

      - name: Commit and open a PR if anything changed
        if: steps.existing-pr.outputs.url == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: scripts/ci/commit-skills-update.sh

      - name: Report skipped run
        if: steps.existing-pr.outputs.url != ''
        run: |
          echo "Skipping -- an update PR is already open: ${{ steps.existing-pr.outputs.url }}"
