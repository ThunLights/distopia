name: CI

on:
  pull_request:
  pull_request_target:
  push:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PUBLIC_URL: http://localhost:3000
  PUBLIC_OWNER_ID: "1261634733037719593"

  PUBLIC_HOME_SERVER_ID: "1505540430110920764"
  PUBLIC_STAFF_ROLE_ID: "1505546268020310117"
  PUBLIC_HONORARY_MEMBER_ROLE_ID: "1505546306721026068"
  PUBLIC_SPECIAL_BOARD_OF_DIRECTORS_ROLE_ID: "1505546372726788126"
  PUBLIC_BOARD_OF_DIRECTORS_ROLE_ID: "1505546412484726804"
  PUBLIC_SUB_BOARD_OF_DIRECTORS_ROLE_ID: "1505546443392422010"

  PUBLIC_BOT_ID: "1505544379639660745"
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  BOT_SECRET: ${{ secrets.BOT_SECRET }}

  DATABASE_URL: ${{ secrets.DATABASE_URL }}

  SENTRY_ORG: thunlights
  SENTRY_PROJECT: distopia-ci
  PUBLIC_SENTRY_DSN: https://c00b15c8dde94b7a50f0706b6ec3d7ed@o4511148812599296.ingest.us.sentry.io/4511955775455232
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  ci-dev:
    name: Development container ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Container
        uses: ./.github/workflows/setup
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Run setup.sh
        working-directory: ./docker/
        run: docker compose exec app sudo scripts/setup.sh

      - name: Typecheck
        working-directory: ./docker/
        run: docker compose exec app sudo bun run typecheck

      - name: Build
        working-directory: ./docker/
        run: docker compose exec app sudo bun run build

      - parallel:
        - name: Lint
          working-directory: ./docker/
          run: docker compose exec app sudo bun run lint

        - name: Test
          working-directory: ./docker/
          run: docker compose exec app sudo bun run test

  e2e-prod:
    name: E2E (production build)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - name: Generate .env
        run: printenv > .env

      - name: Create distopia-db-store
        run: docker volume create distopia-db-store

      - name: Start production stack
        run: ./production/run.sh

      - name: Wait for production server to be ready
        run: timeout 180 bash -c 'until curl -sf http://localhost:3000/ -o /dev/null; do sleep 2; done'

      - name: Run E2E tests against production build
        working-directory: ./docker/
        run: docker compose exec -T app sudo sh -c "cd src/presentation/web && bun run test:e2e:prod"

      - name: Dump app logs on failure
        if: failure()
        working-directory: ./docker/
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs app

      - name: Tear down production stack
        if: always()
        working-directory: ./docker/
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down

  build-prod-image:
    name: Build & push production image
    runs-on: ubuntu-latest
    # Trusted push-to-main only: this publishes a real image tag that the cluster
    # can pull, and needs production-scoped build args/secrets - same reasoning as
    # the SENTRY_AUTH_TOKEN gating above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-app" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dockerfile.prod
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            PUBLIC_URL=${{ vars.PROD_PUBLIC_URL }}
            PUBLIC_OWNER_ID=${{ vars.PROD_PUBLIC_OWNER_ID }}
            PUBLIC_HOME_SERVER_ID=${{ vars.PROD_PUBLIC_HOME_SERVER_ID }}
            PUBLIC_STAFF_ROLE_ID=${{ vars.PROD_PUBLIC_STAFF_ROLE_ID }}
            PUBLIC_HONORARY_MEMBER_ROLE_ID=${{ vars.PROD_PUBLIC_HONORARY_MEMBER_ROLE_ID }}
            PUBLIC_SPECIAL_BOARD_OF_DIRECTORS_ROLE_ID=${{ vars.PROD_PUBLIC_SPECIAL_BOARD_OF_DIRECTORS_ROLE_ID }}
            PUBLIC_BOARD_OF_DIRECTORS_ROLE_ID=${{ vars.PROD_PUBLIC_BOARD_OF_DIRECTORS_ROLE_ID }}
            PUBLIC_SUB_BOARD_OF_DIRECTORS_ROLE_ID=${{ vars.PROD_PUBLIC_SUB_BOARD_OF_DIRECTORS_ROLE_ID }}
            PUBLIC_BOT_ID=${{ vars.PROD_PUBLIC_BOT_ID }}
            PUBLIC_SENTRY_DSN=${{ vars.PROD_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.PROD_SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.PROD_SENTRY_PROJECT }}

  devcontainer:
    name: Dev Container
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate .env
        run: printenv > .env

      - name: Create distopia-db-store
        run: |
          docker volume create distopia-db-store

      - name: Build
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ${{ steps.img.outputs.name }}
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'always' || 'never' }}
          runCmd: |
            sudo ./scripts/setup.sh
            sudo bun run typecheck
            sudo bun run build
            sudo bun run lint
            sudo bun run test
