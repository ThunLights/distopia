name: CI

on:
  pull_request:
  pull_request_target:
  push:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PUBLIC_URL: http://localhost:3000
  PUBLIC_OWNER_ID: "1261634733037719593"

  PUBLIC_HOME_SERVER_ID: "1505540430110920764"
  PUBLIC_STAFF_ROLE_ID: "1505546268020310117"
  PUBLIC_HONORARY_MEMBER_ROLE_ID: "1505546306721026068"
  PUBLIC_SPECIAL_BOARD_OF_DIRECTORS_ROLE_ID: "1505546372726788126"
  PUBLIC_BOARD_OF_DIRECTORS_ROLE_ID: "1505546412484726804"
  PUBLIC_SUB_BOARD_OF_DIRECTORS_ROLE_ID: "1505546443392422010"

  PUBLIC_BOT_ID: "1505544379639660745"
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  BOT_SECRET: ${{ secrets.BOT_SECRET }}

  DATABASE_URL: ${{ secrets.DATABASE_URL }}

  SENTRY_ORG: thunlights
  SENTRY_PROJECT: distopia-ci
  PUBLIC_SENTRY_DSN: https://c00b15c8dde94b7a50f0706b6ec3d7ed@o4511148812599296.ingest.us.sentry.io/4511955775455232
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  ci-dev:
    name: Development container ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Container
        uses: ./.github/workflows/setup
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Run setup.sh
        working-directory: ./docker/
        run: docker compose exec app sudo scripts/setup.sh

      - name: Typecheck
        working-directory: ./docker/
        run: docker compose exec app sudo bun run typecheck

      - name: Build
        working-directory: ./docker/
        run: docker compose exec app sudo bun run build

      - parallel:
        - name: Lint
          working-directory: ./docker/
          run: docker compose exec app sudo bun run lint

        - name: Test
          working-directory: ./docker/
          run: docker compose exec app sudo bun run test

  e2e-prod:
    name: E2E (production build, on kind)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    # Deploys the actual k8s/db and k8s/app manifests (unmodified, aside from the image
    # tag) into a throwaway kind cluster -- the same thing Argo CD applies in real
    # production -- rather than approximating it with a bare `docker run`. The point is to
    # catch manifest-level bugs here too, not just Dockerfile-level ones, so "CI passed" is
    # actually predictive of "the real rollout will work".
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: distopia-e2e

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | sudo bash -s -- /usr/local/bin

      # kind's built-in dynamic provisioner is the StorageClass "standard" (backed by
      # rancher.io/local-path, the same provisioner k3s's "local-path" uses) -- alias it so
      # k8s/db/cluster.yaml's storageClassName: local-path applies completely unmodified,
      # same as it would against the real k3s cluster.
      - name: Alias kind's storage class as local-path
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: local-path
          provisioner: rancher.io/local-path
          volumeBindingMode: WaitForFirstConsumer
          reclaimPolicy: Delete
          EOF

      - name: Install CloudNativePG operator
        run: |
          kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.0.yaml
          kubectl -n cnpg-system wait --for=condition=Available deployment/cnpg-controller-manager --timeout=120s

      - name: Create namespace and secrets
        run: |
          kubectl create namespace distopia
          kubectl create secret generic distopia-db-credentials -n distopia \
            --from-literal=username=distopia \
            --from-literal=password=distopia-e2e-test
          kubectl create secret generic distopia-env -n distopia \
            --from-literal=PUBLIC_URL="$PUBLIC_URL" \
            --from-literal=PUBLIC_OWNER_ID="$PUBLIC_OWNER_ID" \
            --from-literal=PUBLIC_HOME_SERVER_ID="$PUBLIC_HOME_SERVER_ID" \
            --from-literal=PUBLIC_STAFF_ROLE_ID="$PUBLIC_STAFF_ROLE_ID" \
            --from-literal=PUBLIC_HONORARY_MEMBER_ROLE_ID="$PUBLIC_HONORARY_MEMBER_ROLE_ID" \
            --from-literal=PUBLIC_SPECIAL_BOARD_OF_DIRECTORS_ROLE_ID="$PUBLIC_SPECIAL_BOARD_OF_DIRECTORS_ROLE_ID" \
            --from-literal=PUBLIC_BOARD_OF_DIRECTORS_ROLE_ID="$PUBLIC_BOARD_OF_DIRECTORS_ROLE_ID" \
            --from-literal=PUBLIC_SUB_BOARD_OF_DIRECTORS_ROLE_ID="$PUBLIC_SUB_BOARD_OF_DIRECTORS_ROLE_ID" \
            --from-literal=PUBLIC_BOT_ID="$PUBLIC_BOT_ID" \
            --from-literal=BOT_TOKEN="$BOT_TOKEN" \
            --from-literal=BOT_SECRET="$BOT_SECRET" \
            --from-literal=SENTRY_ORG="$SENTRY_ORG" \
            --from-literal=SENTRY_PROJECT="$SENTRY_PROJECT" \
            --from-literal=PUBLIC_SENTRY_DSN="$PUBLIC_SENTRY_DSN" \
            --from-literal=SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN"

      - name: Deploy CloudNativePG cluster (k8s/db, unmodified)
        run: kubectl apply -k k8s/db

      - name: Wait for the database to be ready
        run: |
          timeout 180 bash -c '
            until kubectl get pods -n distopia -l cnpg.io/cluster=distopia-db 2>/dev/null | grep -qE "1/1 +Running"; do
              sleep 5
            done
          '

      - name: Port-forward the database for migrate/build
        run: |
          kubectl port-forward svc/distopia-db-rw 5432:5432 -n distopia &
          echo $! > /tmp/pf-db.pid
          timeout 30 bash -c 'until (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null; do sleep 1; done'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://distopia:distopia-e2e-test@localhost:5432/distopia
        run: |
          bun install --frozen-lockfile
          cd src/infrastructure/database
          bunx prisma migrate deploy

      # Builds the same image k8s/ci/workflowtemplate.yaml's Kaniko step builds, just with
      # `docker build` instead. --network host lets `prisma generate --sql` reach the
      # port-forwarded database above. Build-time-only .env (deleted before the runtime
      # layer, same as the real pipeline) -- BOT_TOKEN/PUBLIC_*/etc. are intentionally not
      # in here, only what `bun run build` itself needs.
      - name: Build production image
        env:
          DATABASE_URL: postgresql://distopia:distopia-e2e-test@localhost:5432/distopia
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SENTRY_ORG=$SENTRY_ORG
          SENTRY_PROJECT=$SENTRY_PROJECT
          SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN
          PUBLIC_SENTRY_DSN=$PUBLIC_SENTRY_DSN
          EOF
          docker build --network host -f docker/dockerfile.prod -t distopia:e2e .
          rm -f .env

      - name: Stop database port-forward
        if: always()
        run: kill "$(cat /tmp/pf-db.pid)" 2>/dev/null || true

      - name: Load image into kind
        run: kind load docker-image distopia:e2e --name distopia-e2e

      - name: Deploy app (k8s/app, image tag bumped the same way the real Workflow does)
        run: |
          cd k8s/app
          kustomize edit set image distopia-registry.distopia.svc.cluster.local:5000/distopia=distopia:e2e
          cd ../..
          kubectl apply -k k8s/app
          kubectl rollout status deployment/distopia-app -n distopia --timeout=180s

      - name: Port-forward the app
        run: |
          kubectl port-forward svc/distopia-app 3000:3000 -n distopia &
          echo $! > /tmp/pf-app.pid
          timeout 180 bash -c 'until curl -sf http://localhost:3000/ -o /dev/null; do sleep 2; done'

      - name: Run E2E tests against production build
        working-directory: ./src/presentation/web
        run: |
          bunx playwright install --with-deps
          bun run test:e2e:prod

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n distopia
          kubectl describe pod -n distopia -l app.kubernetes.io/name=distopia-app
          kubectl logs -n distopia deployment/distopia-app --tail=200
          kubectl get events -n distopia --sort-by=.lastTimestamp

      - name: Tear down
        if: always()
        run: |
          kill "$(cat /tmp/pf-app.pid)" 2>/dev/null || true
          kind delete cluster --name distopia-e2e

  devcontainer:
    name: Dev Container
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate .env
        run: printenv > .env

      - name: Create distopia-db-store
        run: |
          docker volume create distopia-db-store

      - name: Build
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ${{ steps.img.outputs.name }}
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'always' || 'never' }}
          runCmd: |
            sudo ./scripts/setup.sh
            sudo bun run typecheck
            sudo bun run build
            sudo bun run lint
            sudo bun run test
