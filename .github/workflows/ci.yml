name: CI

on:
  pull_request:
  pull_request_target:
  push:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PUBLIC_URL: http://localhost:3000
  PUBLIC_OWNER_ID: "1261634733037719593"

  PUBLIC_HOME_SERVER_ID: "1505540430110920764"
  PUBLIC_STAFF_ROLE_ID: "1505546268020310117"
  PUBLIC_HONORARY_MEMBER_ROLE_ID: "1505546306721026068"
  PUBLIC_SPECIAL_BOARD_OF_DIRECTORS_ROLE_ID: "1505546372726788126"
  PUBLIC_BOARD_OF_DIRECTORS_ROLE_ID: "1505546412484726804"
  PUBLIC_SUB_BOARD_OF_DIRECTORS_ROLE_ID: "1505546443392422010"

  PUBLIC_BOT_ID: "1505544379639660745"
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  BOT_SECRET: ${{ secrets.BOT_SECRET }}

  DATABASE_URL: ${{ secrets.DATABASE_URL }}

  SENTRY_ORG: thunlights
  SENTRY_PROJECT: distopia-ci
  PUBLIC_SENTRY_DSN: https://c00b15c8dde94b7a50f0706b6ec3d7ed@o4511148812599296.ingest.us.sentry.io/4511955775455232
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  ci-dev:
    name: Development container ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Container
        uses: ./.github/workflows/setup
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Run setup.sh
        working-directory: ./docker/
        run: docker compose exec app sudo scripts/setup.sh

      - name: Typecheck
        working-directory: ./docker/
        run: docker compose exec app sudo bun run typecheck

      - name: Build
        working-directory: ./docker/
        run: docker compose exec app sudo bun run build

      - parallel:
        - name: Lint
          working-directory: ./docker/
          run: docker compose exec app sudo bun run lint

        - name: Test
          working-directory: ./docker/
          run: docker compose exec app sudo bun run test

  e2e-prod:
    name: E2E (production build, on kind)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    # Deploys the actual k8s/db and k8s/app manifests (unmodified, aside from the image
    # tag) into a throwaway kind cluster -- the same thing Argo CD applies in real
    # production -- rather than approximating it with a bare `docker run`. The point is to
    # catch manifest-level bugs here too, not just Dockerfile-level ones, so "CI passed" is
    # actually predictive of "the real rollout will work".
    #
    # Getting the database reachable from the runner (needed by `prisma migrate deploy` and
    # by the production image build's `prisma generate --sql`) went through several failed
    # approaches, kept here because the next person touching this will hit the same wall:
    #   1. kubectl port-forward -- its SPDY tunnel is unreliable under kind on GitHub-hosted
    #      runners: it accepts one connection fine, then resets the very next one with
    #      "connection reset by peer", reproducibly, not a rare flake.
    #   2. A NodePort Service, reached via kind's extraPortMappings hostPort (127.0.0.1) --
    #      even with a correct selector and a real, ready Endpoints address, a genuine
    #      Postgres protocol probe (pg_isready) got "no response" indefinitely. A bare TCP
    #      connect() "succeeding" there was a false positive (Docker's own proxy/DNAT
    #      completing the handshake without ever handing bytes through).
    #   3. The same NodePort reached via the kind node container's own Docker bridge IP
    #      instead of 127.0.0.1 (ruling out hairpin-NAT specifically) -- identical result.
    #   4. Inspecting the node directly settled it: `iptables -t nat -L KUBE-NODEPORTS` was
    #      completely empty -- kube-proxy in this kind/GitHub Actions environment is not
    #      programming NodePort DNAT at all (version-specific nftables/iptables-legacy
    #      backend mismatch is the leading suspect; the exact cause doesn't change the fix).
    # The fix used below sidesteps kube-proxy and Kubernetes Services entirely for anything
    # the *runner* needs to reach: a tiny hostNetwork pod (alpine/socat) does a plain
    # OS-level bind on the node and forwards straight to a pod's own IP -- an ordinary
    # process bind and pod-to-pod CNI routing, neither of which depend on kube-proxy at all.
    # kind's extraPortMappings (the one part of this stack that has worked reliably
    # throughout) then publishes that same node port out to the runner.
    #
    # This still leaves one real open question: the *deployed app* itself connects to
    # Postgres via the normal ClusterIP Service DNS name (k8s/app/deployment.yaml's
    # DB_HOST), exactly like it would in real production -- deliberately not routed around,
    # since that's precisely the manifest-level behavior this job exists to catch. The
    # "Verify in-cluster Service routing works" step below checks that specific path early
    # and fails fast with a clear message if it doesn't, instead of a confusing rollout
    # timeout several minutes later.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: distopia-e2e
          config: .github/kind-config.yaml

      # kustomize is already preinstalled on GitHub's ubuntu-latest runner image at
      # /usr/local/bin/kustomize -- no separate install step needed (and the official
      # install script refuses to run if it finds a binary already there).

      # kind's built-in dynamic provisioner is the StorageClass "standard" (backed by
      # rancher.io/local-path, the same provisioner k3s's "local-path" uses) -- alias it so
      # k8s/db/cluster.yaml's storageClass: local-path applies completely unmodified, same
      # as it would against the real k3s cluster.
      - name: Alias kind's storage class as local-path
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: local-path
          provisioner: rancher.io/local-path
          volumeBindingMode: WaitForFirstConsumer
          reclaimPolicy: Delete
          EOF

      - name: Install CloudNativePG operator
        run: |
          kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.0.yaml
          kubectl -n cnpg-system wait --for=condition=Available deployment/cnpg-controller-manager --timeout=120s

      # Generates the Secret manifests from this job's own env (same idea as the
      # devcontainer/ci-dev jobs' "Generate .env" step), instead of one long
      # --from-literal argument list -- kubectl apply -f - reads it straight off stdin, so
      # the rendered YAML (with real secret values) never touches disk on the runner.
      - name: Create namespace and secrets
        run: |
          kubectl create namespace distopia
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: distopia-db-credentials
            namespace: distopia
          stringData:
            username: distopia
            password: distopia-e2e-test
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: distopia-env
            namespace: distopia
          stringData:
            PUBLIC_URL: "$PUBLIC_URL"
            PUBLIC_OWNER_ID: "$PUBLIC_OWNER_ID"
            PUBLIC_HOME_SERVER_ID: "$PUBLIC_HOME_SERVER_ID"
            PUBLIC_STAFF_ROLE_ID: "$PUBLIC_STAFF_ROLE_ID"
            PUBLIC_HONORARY_MEMBER_ROLE_ID: "$PUBLIC_HONORARY_MEMBER_ROLE_ID"
            PUBLIC_SPECIAL_BOARD_OF_DIRECTORS_ROLE_ID: "$PUBLIC_SPECIAL_BOARD_OF_DIRECTORS_ROLE_ID"
            PUBLIC_BOARD_OF_DIRECTORS_ROLE_ID: "$PUBLIC_BOARD_OF_DIRECTORS_ROLE_ID"
            PUBLIC_SUB_BOARD_OF_DIRECTORS_ROLE_ID: "$PUBLIC_SUB_BOARD_OF_DIRECTORS_ROLE_ID"
            PUBLIC_BOT_ID: "$PUBLIC_BOT_ID"
            BOT_TOKEN: "$BOT_TOKEN"
            BOT_SECRET: "$BOT_SECRET"
            SENTRY_ORG: "$SENTRY_ORG"
            SENTRY_PROJECT: "$SENTRY_PROJECT"
            PUBLIC_SENTRY_DSN: "$PUBLIC_SENTRY_DSN"
            SENTRY_AUTH_TOKEN: "$SENTRY_AUTH_TOKEN"
          EOF

      - name: Deploy CloudNativePG cluster (k8s/db, unmodified)
        run: kubectl apply -k k8s/db

      # `kubectl exec ... pg_isready` only proves postgres itself answers queries inside the
      # container -- it says nothing about the pod's Kubernetes Ready condition, which is
      # what actually gates whether any Service publishes it as an endpoint. Wait on the
      # Ready condition directly. `kubectl wait` errors immediately ("not found") instead of
      # waiting if the pod doesn't exist yet, so retry it rather than call it once --
      # right after `kubectl apply`, the operator hasn't created the pod yet.
      - name: Wait for the database to be ready
        run: |
          timeout 180 bash -c '
            until kubectl wait --for=condition=Ready pod/distopia-db-1 -n distopia --timeout=10s 2>/dev/null; do
              sleep 3
            done
          '

      # Settles, early and cheaply, whether normal Kubernetes Service routing (ClusterIP,
      # via kube-proxy) works at all in this environment -- the exact mechanism the deployed
      # app itself will depend on for DB_HOST=distopia-db-rw.distopia.svc.cluster.local. If
      # this fails, deploying the app later is guaranteed to fail too (it'll crashloop on
      # its own DB connection), so fail here with a clear diagnostic instead of a confusing
      # rollout timeout several minutes from now.
      - name: Verify in-cluster Service routing works
        run: |
          kubectl run distopia-clusterip-probe -n distopia --rm -i --restart=Never \
            --pod-running-timeout=30s --image=postgres:17-alpine --command \
            -- pg_isready -h distopia-db-rw -p 5432 -U distopia -d distopia

      # The runner (bun install/prisma migrate/docker build) still needs to reach postgres
      # from OUTSIDE the cluster -- see the job-level comment for why NodePort doesn't work
      # here. Connect a hostNetwork relay directly to the pod's own IP (not the Service),
      # so this step's correctness never depends on the ClusterIP check above -- an ordinary
      # OS-level port bind and pod-to-pod CNI routing, nothing kube-proxy has to program.
      - name: Expose the database via a hostNetwork relay pod for migrate/build
        run: |
          DB_POD_IP="$(kubectl get pod distopia-db-1 -n distopia -o jsonpath='{.status.podIP}')"
          echo "distopia-db-1 pod IP: $DB_POD_IP"

          kubectl run distopia-db-relay -n distopia \
            --image=alpine/socat \
            --restart=Never \
            --overrides='{"spec":{"hostNetwork":true,"dnsPolicy":"ClusterFirstWithHostNet"}}' \
            -- "TCP-LISTEN:30432,fork,reuseaddr" "TCP:${DB_POD_IP}:5432"

          echo "Waiting for the relay pod to be ready..."
          timeout 60 bash -c '
            until kubectl wait --for=condition=Ready pod/distopia-db-relay -n distopia --timeout=10s 2>/dev/null; do
              sleep 3
            done
          '

          echo "DATABASE_URL=postgresql://distopia:distopia-e2e-test@127.0.0.1:30432/distopia" >> "$GITHUB_ENV"

          # A real Postgres protocol exchange (not just a TCP connect) confirms the relay
          # genuinely forwards to postgres, not just that something is listening on the port.
          sudo apt-get update -y >/dev/null && sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          echo "Waiting for the relay to actually proxy a real Postgres handshake through to the pod..."
          timeout 60 bash -c '
            until PGCONNECT_TIMEOUT=3 pg_isready -h 127.0.0.1 -p 30432 -U distopia -d distopia; do
              sleep 3
            done
          '

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # The relay being reachable a moment ago doesn't guarantee it still is a few seconds
      # later (bun install alone takes ~7s) -- retry rather than assume the first real
      # connection attempt succeeds just because the previous step's probe did.
      - name: Apply database migrations
        run: |
          bun install --frozen-lockfile
          cd src/infrastructure/database

          for attempt in 1 2 3 4 5; do
            if bunx prisma migrate deploy; then
              exit 0
            fi
            echo "migrate deploy attempt $attempt failed, retrying in 5s..." >&2
            sleep 5
          done
          exit 1

      # Builds the same image k8s/ci/workflowtemplate.yaml's Kaniko step builds, just with
      # `docker build` instead. --network host lets `prisma generate --sql` reach the
      # relay-exposed database above. Build-time-only .env (deleted before the runtime
      # layer, same as the real pipeline) -- BOT_TOKEN/PUBLIC_*/etc. are intentionally not
      # in here, only what `bun run build` itself needs.
      - name: Build production image
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SENTRY_ORG=$SENTRY_ORG
          SENTRY_PROJECT=$SENTRY_PROJECT
          SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN
          PUBLIC_SENTRY_DSN=$PUBLIC_SENTRY_DSN
          EOF
          docker build --network host -f docker/dockerfile.prod -t distopia:e2e .
          rm -f .env

      - name: Load image into kind
        run: kind load docker-image distopia:e2e --name distopia-e2e

      - name: Deploy app (k8s/app, image tag bumped the same way the real Workflow does)
        run: |
          cd k8s/app
          kustomize edit set image distopia-registry.distopia.svc.cluster.local:5000/distopia=distopia:e2e
          cd ../..
          kubectl apply -k k8s/app
          kubectl rollout status deployment/distopia-app -n distopia --timeout=180s

      # Same rationale as the database relay above: kubectl port-forward is unreliable here,
      # and there's no NodePort/Ingress on this Service by design (k8s/app/service.yaml is
      # ClusterIP-only, matching real production's Cloudflare-Tunnel-only exposure model).
      - name: Expose the app via a hostNetwork relay pod
        run: |
          APP_POD_IP="$(kubectl get pod -n distopia -l app.kubernetes.io/name=distopia-app -o jsonpath='{.items[0].status.podIP}')"
          echo "distopia-app pod IP: $APP_POD_IP"

          kubectl run distopia-app-relay -n distopia \
            --image=alpine/socat \
            --restart=Never \
            --overrides='{"spec":{"hostNetwork":true,"dnsPolicy":"ClusterFirstWithHostNet"}}' \
            -- "TCP-LISTEN:3000,fork,reuseaddr" "TCP:${APP_POD_IP}:3000"

          echo "Waiting for the relay pod to be ready..."
          timeout 60 bash -c '
            until kubectl wait --for=condition=Ready pod/distopia-app-relay -n distopia --timeout=10s 2>/dev/null; do
              sleep 3
            done
          '

          echo "Waiting for the relay to actually proxy a real HTTP response through to the app..."
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:3000/ -o /dev/null; do sleep 3; done'

      - name: Run E2E tests against production build
        working-directory: ./src/presentation/web
        run: |
          bunx playwright install --with-deps
          bun run test:e2e:prod

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n distopia
          kubectl describe pod -n distopia -l app.kubernetes.io/name=distopia-app
          kubectl logs -n distopia deployment/distopia-app --tail=200
          kubectl logs -n distopia pod/distopia-db-1 -c postgres --tail=100 || true
          kubectl get events -n distopia --sort-by=.lastTimestamp

      - name: Tear down
        if: always()
        run: kind delete cluster --name distopia-e2e

  devcontainer:
    name: Dev Container
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate .env
        run: printenv > .env

      - name: Create distopia-db-store
        run: |
          docker volume create distopia-db-store

      - name: Build
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ${{ steps.img.outputs.name }}
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'always' || 'never' }}
          runCmd: |
            sudo ./scripts/setup.sh
            sudo bun run typecheck
            sudo bun run build
            sudo bun run lint
            sudo bun run test
