name: distopia

services:
  db:
    container_name: distopia-db
    image: postgres:17
    volumes:
      - distopia-db-store:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - distopia-network
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PW:-0000}
      POSTGRES_DB: ${DB_NAME:-distopia}

  redis:
    container_name: distopia-redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - distopia-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    container_name: distopia-app
    depends_on:
      db:
        condition: service_started
      redis:
        # Unlike `db` (nothing here waits on Postgres readiness beyond container start),
        # this actually matters: ioredis's own reconnect/offline-queue behavior covers a
        # Redis that becomes unavailable *after* startup, but not one that was never reachable
        # in the first place if the app happens to need it (see Tts.getAllVoiceSessions'
        # restoreSessions caller) before Redis has finished starting.
        condition: service_healthy
    restart: always
    build:
      context: ./
      dockerfile: dockerfile
    init: true
    networks:
      - distopia-network
    volumes:
      - ..:/workspaces/distopia:cached
      - distopia-node-modules:/workspaces/distopia/node_modules

volumes:
  distopia-db-store:
    external: true
  distopia-node-modules:

networks:
  distopia-network:
