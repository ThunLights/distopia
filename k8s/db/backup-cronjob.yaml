# There is otherwise NO backup of this data at all -- a single instance (see cluster.yaml),
# a single PVC, no WAL archiving, nothing. This CronJob is a minimal, self-contained safety
# net: a daily pg_dump onto its own PVC (old dumps pruned after 14 days), then mirrored
# off-host to a Cloudflare R2 bucket so a lost node/disk doesn't take the only copy with it.
#
# `upload-r2`'s `aws s3 sync --delete` mirrors the *entire* /backup directory to R2 on every
# run, rather than uploading just the new file -- this piggybacks on `pg-dump`'s existing
# 14-day `find -mtime +14 -delete` for retention, so R2 ends up with the same 14-day window
# with no separate remote-pruning logic to keep in sync.
#
# Known remaining limitation: this is still periodic pg_dump snapshots, not continuous WAL
# archiving -- up to a day of data can be lost between dumps, and there's no point-in-time
# recovery. If that ever matters more than the simplicity here, switch to CloudNativePG's
# native `.spec.backup.barmanObjectStore` on the Cluster instead (it can point at the same R2
# bucket) and retire this CronJob.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: distopia-db-backup-data
  namespace: distopia
spec:
  accessModes:
    - ReadWriteOnce
  # TODO: confirm this matches a StorageClass that exists on your k3s cluster.
  # k3s ships "local-path" by default.
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: distopia-db-backup
  namespace: distopia
spec:
  # Adjust to your own timezone/preference -- UTC by default (no `timeZone` field set).
  schedule: "0 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A dump that somehow hangs shouldn't be able to block every subsequent day's run
      # forever under Forbid -- give it a generous but finite ceiling.
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # 1. Dump to the local PVC first (initContainers run sequentially, before the
          #    main containers below) -- upload-r2 needs a finished dump to sync.
          initContainers:
            - name: pg-dump
              # Same image family CloudNativePG itself runs (see cluster.yaml's imageName)
              # so pg_dump/pg_restore are guaranteed version-compatible with the server.
              image: ghcr.io/cloudnative-pg/postgresql:17
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  export PGPASSWORD="$DB_PASSWORD"
                  dest="/backup/distopia-$(date -u +%Y%m%dT%H%M%SZ).dump"

                  # A freshly-scheduled Pod's own networking (kube-proxy/CNI route setup for
                  # this specific Pod) isn't always fully ready the instant its container
                  # starts -- confirmed directly: a bare first attempt got "no response" from
                  # pg_isready, while a second attempt ~3s later succeeded, even though the
                  # long-running app Deployment (already up, never needing to race this)
                  # reaches the same Service without issue. Retry rather than assume the
                  # first connection attempt lands.
                  for attempt in 1 2 3 4 5; do
                    if pg_dump -h "$DB_HOST" -U "$DB_USER" -d distopia --format=custom -f "$dest"; then
                      break
                    fi
                    if [ "$attempt" = 5 ]; then
                      echo "pg_dump failed after 5 attempts" >&2
                      exit 1
                    fi
                    echo "pg_dump attempt $attempt failed, retrying in 3s..." >&2
                    sleep 3
                  done
                  echo "wrote $dest"
                  find /backup -name 'distopia-*.dump' -mtime +14 -delete
                  echo "current backups:"
                  ls -lh /backup
              env:
                # Originally -r ("any" instance), on the theory that it'd keep working
                # unchanged if instances is ever bumped above 1 for HA. In real production,
                # distopia-db-r consistently refused connections (pg_dump: Connection
                # refused) while distopia-db-rw kept working fine for the app the entire
                # time -- confirmed repeatedly, not a one-off flake. Root cause not fully
                # understood; -rw is proven reliable, so use it. Revisit -r vs -rw if
                # instances is ever raised above 1.
                - name: DB_HOST
                  value: distopia-db-rw.distopia.svc.cluster.local
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: distopia-db-credentials
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: distopia-db-credentials
                      key: password
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          # 2. Mirror the whole (already-pruned) /backup directory to R2. `--delete` removes
          #    anything on R2 that's no longer in /backup, so pg-dump's 14-day local pruning
          #    above is the only retention logic needed -- R2 just follows it.
          containers:
            - name: upload-r2
              image: amazon/aws-cli:2.31.13
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  aws s3 sync /backup "s3://${R2_BUCKET}/distopia-db-backups" \
                    --delete --endpoint-url "$R2_ENDPOINT"
              env:
                # R2 has no concept of regions, but the aws-cli SDK still requires this to be
                # set to something -- "auto" is Cloudflare's documented value.
                - name: AWS_DEFAULT_REGION
                  value: auto
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: distopia-db-r2-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: distopia-db-r2-credentials
                      key: secret-access-key
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: distopia-db-r2-credentials
                      key: endpoint
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: distopia-db-r2-credentials
                      key: bucket
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: distopia-db-backup-data
