# Defense-in-depth: restrict CloudNativePG pods to intra-namespace traffic only (the app
# Deployment and the Workflow's migrate step are the only legitimate clients). Same CNI
# caveat as k8s/registry/networkpolicy.yaml -- not enforced under k3s's default Flannel CNI
# without Calico/Cilium or similar. See k8s/README.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: distopia-db-allow-intra-namespace
  namespace: distopia
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: distopia-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
