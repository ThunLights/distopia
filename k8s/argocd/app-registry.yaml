apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: distopia-registry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thunlights/distopia.git
    targetRevision: main
    path: k8s/registry
  destination:
    server: https://kubernetes.default.svc
    namespace: distopia
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
