# Watches k8s/network -- the hostNetwork relay that lets the host-level Cloudflare Tunnel
# reach distopia-app via a loopback port you choose yourself (see k8s/README.md section 2 --
# the actual port number is never committed). Stateless (just a socat process), so
# prune:true is safe here, unlike distopia-db.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: distopia-network
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thunlights/distopia.git
    targetRevision: main
    path: k8s/network
  destination:
    server: https://kubernetes.default.svc
    namespace: distopia
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
