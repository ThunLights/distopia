# This Application watches k8s/app on main for real manifest changes (Deployment/Service/
# ConfigMap edits), AND carries the Argo CD Image Updater annotations below, which are what
# actually ship a new build -- Image Updater polls ghcr.io directly and patches this
# Application's `spec.source.kustomize.images` in place (write-back-method: argocd) whenever
# a newer image shows up, with no git commit involved. See "Shipping a new build" in
# k8s/README.md for the full flow.
#
# update-strategy is `alphabetical`, not `newest-build`: `newest-build` sorts by each
# image's build-completion timestamp, which is exactly what would race if two pushes land on
# main close together and spawn overlapping GitHub Actions runs -- an older commit's build
# can finish (and get pushed) after a newer commit's, and `newest-build` would then deploy
# the OLDER commit. `.github/workflows/deploy.yml` instead tags each image
# "<committer-epoch>-<short-sha>", a value that only depends on the commit itself, not on how
# long its build took -- `alphabetical` sorting on that tag always recovers true source order
# regardless of build duration.
#
# These annotations alone do nothing on Image Updater v1.x -- that version reconciles a
# separate `ImageUpdater` CR (see k8s/argocd/imageupdater.yaml) and only reads these
# annotations for Applications matched by a ref with `useAnnotations: true`. Confirmed the
# hard way: the controller logged "No ImageUpdater CRs to process" and did nothing until
# that CR existed.
#
# No pull-secret annotation -- ghcr.io/thunlights/distopia is a public package (verify this
# under the package's own Settings after the first push; GHCR packages don't always inherit
# the repository's public visibility automatically), so Image Updater polls it anonymously.
# If it's ever made private, both this annotation and k8s/app/deployment.yaml's
# imagePullSecrets would need to come back.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: distopia-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: distopia=ghcr.io/thunlights/distopia
    argocd-image-updater.argoproj.io/distopia.update-strategy: alphabetical
    argocd-image-updater.argoproj.io/distopia.allow-tags: regexp:^[0-9]{10}-[0-9a-f]{7,10}$
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thunlights/distopia.git
    targetRevision: main
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: distopia
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
