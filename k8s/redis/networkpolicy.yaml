# Defense-in-depth: even with no Ingress/NodePort/LoadBalancer, restrict ingress to only the
# two Deployments that actually talk to this Redis (distopia-app and, now that
# presentation-bot owns its own AppState["memory"] stores too -- see
# src/presentation/bot/src/server/memory.ts -- distopia-bot) rather than every pod in the
# namespace. The CNPG-managed database has no reason to reach an unauthenticated Redis
# holding TTS session pointers, so it's deliberately not included here.
#
# Label selector matches what OT-CONTAINER-KIT/redis-operator actually stamps on the pod it
# generates from redis.yaml (`app: <CR name>`, `redis_setup_type: standalone`) -- confirmed
# against the operator's own label-generation source
# (internal/controller/common/labels.go), not the app.kubernetes.io/* convention the old
# hand-written Deployment used.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: distopia-redis-allow-intra-namespace
  namespace: distopia
spec:
  podSelector:
    matchLabels:
      app: distopia-redis
      redis_setup_type: standalone
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: distopia-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: distopia-bot
