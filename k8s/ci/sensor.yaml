# Anti-loop: the update-manifest step in workflowtemplate.yaml pushes its own commit to
# main (to bump the image tag), which would otherwise re-trigger this same Sensor forever.
# The exprs filter below rejects any push whose head commit message starts with
# "chore(deploy):" -- the exact prefix that step always uses.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: distopia-github-push
  namespace: distopia
spec:
  eventBusName: default
  template:
    serviceAccountName: distopia-sensor-sa
  dependencies:
    - name: github-push
      eventSourceName: github
      eventName: push
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - refs/heads/main
          - path: body.repository.full_name
            type: string
            value:
              - thunlights/distopia
        exprs:
          - expr: "headCommitMessage[0:14] != 'chore(deploy):'"
            fields:
              - name: headCommitMessage
                path: body.head_commit.message
  triggers:
    - template:
        name: trigger-build-deploy
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: distopia-build-deploy-
                namespace: distopia
              spec:
                workflowTemplateRef:
                  name: distopia-build-deploy
                arguments:
                  parameters:
                    - name: revision
                      value: placeholder
          parameters:
            - src:
                dependencyName: github-push
                dataKey: body.after
              dest: spec.arguments.parameters.0.value
