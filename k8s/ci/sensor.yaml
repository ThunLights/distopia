# Only ref + repo are filtered here. No anti-loop filter is needed: the triggered Workflow
# (workflowtemplate.yaml) only ever builds and pushes an image, it never commits back to
# git, so there's no self-triggering commit to exclude in the first place. Argo CD Image
# Updater (see k8s/argocd/app-app.yaml) is what actually ships the build, by polling the
# registry directly rather than reacting to a git push.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: distopia-github-push
  namespace: distopia
spec:
  eventBusName: default
  template:
    serviceAccountName: distopia-sensor-sa
    # Diagnostic: RBAC, NetworkPolicy, and EventBus delivery have all been verified healthy
    # (STAN's channelsz confirms messages are delivered to this Sensor's own subscription),
    # yet no Workflow is ever created and the default "info" log level shows nothing at all
    # for these events -- not even a trigger-execution error. Bumping to debug to see what
    # actually happens inside trigger execution.
    container:
      env:
        - name: LOG_LEVEL
          value: debug
  dependencies:
    - name: github-push
      eventSourceName: github
      eventName: push
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - refs/heads/main
          - path: body.repository.full_name
            type: string
            value:
              - thunlights/distopia
  triggers:
    - template:
        name: trigger-build-deploy
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: distopia-build-deploy-
                namespace: distopia
              spec:
                workflowTemplateRef:
                  name: distopia-build-deploy
                arguments:
                  parameters:
                    - name: revision
                      value: placeholder
          parameters:
            - src:
                dependencyName: github-push
                dataKey: body.after
              dest: spec.arguments.parameters.0.value
