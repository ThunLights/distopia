# Anti-loop: the update-manifest step in workflowtemplate.yaml pushes its own commit to
# main (to bump the image tag), which would otherwise re-trigger this same Sensor forever.
# The data filter below rejects any push whose head commit message starts with
# "chore(deploy):" -- the exact prefix that step always uses.
#
# Implemented via `template` (Sprig's hasPrefix, evaluated by Argo Events itself before the
# match) feeding into a plain exact-match `value` list, NOT the `comparator` field -- verified
# live that `comparator: "!="` against body.head_commit.author.email silently dropped every
# push event with zero log output (STAN confirmed the message was actually delivered to the
# Sensor's subscription; something in that comparison just never matched). This mirrors two
# earlier failures on this same Sensor: an exprs filter using Python-style slicing, then one
# using the startsWith operator, both of which failed to parse against whatever expr engine
# build is bundled in this Argo Events install. Sprig templating is a much more standard,
# widely-used code path (shared with Helm) than any of those, so it's the safer bet here.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: distopia-github-push
  namespace: distopia
spec:
  eventBusName: default
  template:
    serviceAccountName: distopia-sensor-sa
  dependencies:
    - name: github-push
      eventSourceName: github
      eventName: push
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - refs/heads/main
          - path: body.repository.full_name
            type: string
            value:
              - thunlights/distopia
          - path: body.head_commit.message
            type: string
            template: '{{ if hasPrefix "chore(deploy):" . }}skip{{ else }}allow{{ end }}'
            value:
              - allow
  triggers:
    - template:
        name: trigger-build-deploy
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: distopia-build-deploy-
                namespace: distopia
              spec:
                workflowTemplateRef:
                  name: distopia-build-deploy
                arguments:
                  parameters:
                    - name: revision
                      value: placeholder
          parameters:
            - src:
                dependencyName: github-push
                dataKey: body.after
              dest: spec.arguments.parameters.0.value
