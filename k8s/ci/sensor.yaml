# Only ref + repo are filtered here. Anti-loop protection (skipping the update-manifest
# step's own "chore(deploy):" commits) used to live here as a third filter, but FOUR
# different implementations -- exprs slicing, exprs startsWith, a data filter comparator,
# and a data filter Sprig template -- all silently dropped every push event with zero log
# output, even though the EventSource->EventBus delivery and this Sensor's own subscription
# were confirmed healthy each time (STAN's channelsz showed last_sent caught up to last_seq,
# pending_count 0). Whatever's wrong lives inside this specific Argo Events build's filter
# evaluation, not in EventBus delivery or RBAC (also verified). The anti-loop check now lives
# in workflowtemplate.yaml's "clone" step instead, using a plain POSIX `case` glob match
# gated by a DAG `when` condition -- Argo Workflows' own DAG engine, which has worked
# correctly throughout this pipeline's development, unlike this Sensor's filter engine.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: distopia-github-push
  namespace: distopia
spec:
  eventBusName: default
  template:
    serviceAccountName: distopia-sensor-sa
  dependencies:
    - name: github-push
      eventSourceName: github
      eventName: push
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - refs/heads/main
          - path: body.repository.full_name
            type: string
            value:
              - thunlights/distopia
  triggers:
    - template:
        name: trigger-build-deploy
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: distopia-build-deploy-
                namespace: distopia
              spec:
                workflowTemplateRef:
                  name: distopia-build-deploy
                arguments:
                  parameters:
                    - name: revision
                      value: placeholder
          parameters:
            - src:
                dependencyName: github-push
                dataKey: body.after
              dest: spec.arguments.parameters.0.value
