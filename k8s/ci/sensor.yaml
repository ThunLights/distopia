# Only ref + repo are filtered here. No anti-loop filter is needed: the triggered Workflow
# (workflowtemplate.yaml) only ever builds and pushes an image, it never commits back to
# git, so there's no self-triggering commit to exclude in the first place. Argo CD Image
# Updater (see k8s/argocd/app-app.yaml) is what actually ships the build, by polling the
# registry directly rather than reacting to a git push.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: distopia-github-push
  namespace: distopia
spec:
  eventBusName: default
  template:
    serviceAccountName: distopia-sensor-sa
  dependencies:
    - name: github-push
      eventSourceName: github
      eventName: push
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - refs/heads/main
          # This data filter does an exact, case-sensitive string match. Was "thunlights/distopia"
          # (lowercase) since this pipeline's very first commit -- GitHub's webhook payload always
          # sends the repo's real casing ("ThunLights/distopia"), so every genuine push silently
          # failed this filter and no Workflow was ever auto-triggered by a real push; every
          # "Succeeded" Workflow run up to this fix came from a manual `argo submit`, not the Sensor.
          - path: body.repository.full_name
            type: string
            value:
              - ThunLights/distopia
  triggers:
    - template:
        name: trigger-build-deploy
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: distopia-build-deploy-
                namespace: distopia
              spec:
                workflowTemplateRef:
                  name: distopia-build-deploy
                arguments:
                  parameters:
                    - name: revision
                      value: placeholder
          parameters:
            - src:
                dependencyName: github-push
                dataKey: body.after
              dest: spec.arguments.parameters.0.value
