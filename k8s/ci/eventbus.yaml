# Argo Events requires an EventBus to exist in every namespace that has EventSources/Sensors.
#
# This used to be `nats: native: {}` (NATS Streaming / STAN, the legacy backend). Migrated to
# JetStream after an extensive investigation: EventSource->EventBus delivery was repeatedly
# confirmed via STAN's own /streaming/channelsz admin endpoint (last_sent caught up to
# last_seq, pending_count 0, is_stalled false) for every single push, yet the Sensor showed
# zero trace -- not even at LOG_LEVEL=debug -- of ever receiving those messages. RBAC,
# NetworkPolicy, and the Sensor's filters were all separately ruled out. STAN is also formally
# deprecated upstream and known to have connection-level flakiness (repeated heartbeat
# timeouts / forced reconnects were observed on this exact bus throughout the investigation).
# JetStream is Argo Events' actively maintained, recommended EventBus backend -- switching
# requires no changes to eventsource.yaml or sensor.yaml, since they only reference this
# EventBus by name and the client wiring is handled by the controller.
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: distopia
spec:
  jetstream:
    # Pinned rather than "latest": that alias is resolved through the cluster's
    # argo-events-controller-config ConfigMap and can silently move to a different NATS
    # server image on a future argo-events upgrade, independent of this file. "latest"
    # happens to currently map to this exact version, so pinning it changes nothing today.
    version: "2.10.10"
    # Matches the previous STAN setup's replica count. This is a single-node k3s cluster
    # (every pod so far has landed on the one node) -- pod anti-affinity for spreading these
    # 3 replicas across nodes would just leave 2 of them permanently unschedulable, so it's
    # intentionally omitted. Revisit if a second node is ever added.
    replicas: 3
    # Persistence is optional for JetStream (it falls back to an ephemeral volume without
    # it), but is set here so events survive a pod restart/crash instead of being lost -- a
    # low-traffic single webhook doesn't need much storage.
    persistence:
      storageClassName: local-path
      volumeSize: 1Gi
