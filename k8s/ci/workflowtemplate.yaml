# Triggered by sensor.yaml on every push to main. Runs entirely inside the cluster:
# clone -> (write .env from k8s Secrets, and run the DB migration, in parallel) -> build
# & push image with Kaniko (no external registry, no docker daemon). No step here ever
# writes back to git -- Argo CD Image Updater (see k8s/argocd/app-app.yaml's annotations)
# polls the registry directly and rolls the Deployment once it sees a newer image, so there
# is also no self-triggering commit here for anything to filter out.
#
# Migration runs BEFORE the image build, not after: `prisma generate --sql`
# (infra-database's build step, using Prisma's typedSql preview feature) needs to connect
# to a real, already-migrated database to type-check the raw SQL under prisma/sql/*.sql --
# it's not pure offline codegen. So the schema must be current before `bun run build` runs
# inside the Kaniko step. This does mean migrations must stay backward-compatible with the
# still-running old replica until its rollout finishes (standard expand/contract practice).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: distopia-build-deploy
  namespace: distopia
spec:
  serviceAccountName: distopia-workflow-sa
  entrypoint: main
  arguments:
    parameters:
      - name: revision

  # Auto-delete after the workflow finishes; this PVC only ever holds one build's worth of
  # source + node_modules.
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

  templates:
    - name: main
      dag:
        tasks:
          - name: clone
            template: clone

          - name: prepare-env
            template: prepare-env
            dependencies: [clone]

          - name: migrate
            template: migrate
            dependencies: [clone]

          - name: build-push
            template: build-push
            dependencies: [prepare-env, migrate]
            arguments:
              parameters:
                - name: short-sha
                  value: "{{tasks.clone.outputs.parameters.short-sha}}"
                - name: image-tag
                  value: "{{tasks.clone.outputs.parameters.image-tag}}"

    # 1. Clone the exact commit that triggered the webhook, not just the branch tip, so a
    #    fast-follow push during the build can't get silently included.
    #
    #    Also writes image-tag = "<committer-epoch>-<short-sha>". The committer timestamp
    #    (not build time) is what Argo CD Image Updater's `alphabetical` strategy sorts on
    #    (see k8s/argocd/app-app.yaml) -- two pushes landing on main close together spawn
    #    unordered Workflow runs, so an older commit's build can finish after a newer
    #    commit's. Sorting by build completion time (the `newest-build` strategy) would
    #    then deploy the OLDER commit, since it happened to finish building last -- sorting
    #    by each commit's own timestamp instead is immune to build-duration variance
    #    entirely, since it never depends on when the build finished.
    - name: clone
      container:
        image: alpine/git:2.47.2
        workingDir: /workspace
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            git clone --no-checkout https://github.com/thunlights/distopia.git src
            cd src
            git checkout "{{workflow.parameters.revision}}"
            git rev-parse --short HEAD > /workspace/short-sha
            printf '%s-%s' "$(git show -s --format=%ct HEAD)" "$(cat /workspace/short-sha)" \
              > /workspace/image-tag
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      outputs:
        parameters:
          - name: short-sha
            valueFrom:
              path: /workspace/short-sha
          - name: image-tag
            valueFrom:
              path: /workspace/image-tag

    # 2. Materialize a BUILD-time-only .env into the cloned tree -- just what
    #    `bun run build` itself needs (DATABASE_URL for infra-database's `prisma generate
    #    --sql`, SENTRY_ORG/SENTRY_PROJECT for the Sentry vite plugin's debug-ID injection).
    #    This is an ALLOWLIST, not a denylist: distopia-env holds every app runtime secret
    #    (BOT_TOKEN, PUBLIC_*, SENTRY_AUTH_TOKEN, ...), and only the two names below ever get
    #    written to /workspace/src/.env. Anything else would sit in the build workspace where
    #    `bun run build` (and any of its transitive deps) could read or exfiltrate it --
    #    excluding just SENTRY_AUTH_TOKEN by name isn't good enough, since the next secret
    #    added to distopia-env would silently leak into the build again. Runtime secrets are
    #    only ever injected as live env vars into the running Pod (k8s/app/deployment.yaml),
    #    never present in the image. SENTRY_AUTH_TOKEN specifically is excluded on purpose
    #    (see docker/dockerfile.prod): source map upload happens at app startup now
    #    (src/presentation/web/src/lib/server/sourcemaps.ts), using the same secret key as a
    #    normal runtime env var, so the real Sentry credential never needs to be a build input
    #    at all. This .env is deleted by docker/dockerfile.prod before the runtime layer is
    #    created.
    - name: prepare-env
      container:
        image: alpine:3.21
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            : > /workspace/src/.env
            for f in /secrets/app/*; do
              name="$(basename "$f")"
              case "$name" in
                SENTRY_ORG | SENTRY_PROJECT) ;;
                *) continue ;;
              esac
              printf '%s=%s\n' "$name" "$(cat "$f")" >> /workspace/src/.env
            done
            printf 'DATABASE_URL=%s\n' "$(cat /secrets/db/url)" >> /workspace/src/.env
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: app-secret
            mountPath: /secrets/app
            readOnly: true
          - name: db-secret
            mountPath: /secrets/db
            readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
        - name: app-secret
          # The whole distopia-env secret is mounted here (every key is readable in this
          # container), but prepare-env's script above only ever writes SENTRY_ORG/
          # SENTRY_PROJECT out to the build workspace -- everything else (BOT_TOKEN,
          # PUBLIC_*, SENTRY_AUTH_TOKEN, ...) is mounted but never leaves this step.
          secret:
            secretName: distopia-env
        - name: db-secret
          # Same user-chosen credentials given to CloudNativePG's Cluster -- see
          # k8s/db/cluster.yaml and k8s/README.md.
          secret:
            secretName: distopia-db-credentials

    # 3b. Build with Kaniko (no privileged docker daemon needed) and push straight to the
    #    cluster-internal registry -- this image never touches an external registry. Tagged
    #    with image-tag (see clone's comment for why it's "<committer-epoch>-<short-sha>",
    #    not just the short-sha alone) -- this is the tag Argo CD Image Updater's
    #    `allow-tags` regexp matches on (see k8s/argocd/app-app.yaml).
    - name: build-push
      inputs:
        parameters:
          - name: short-sha
          - name: image-tag
      container:
        image: gcr.io/kaniko-project/executor:v1.23.2
        args:
          - --dockerfile=docker/dockerfile.prod
          - --context=dir:///workspace/src
          - --destination=distopia-registry.distopia.svc.cluster.local:5000/distopia:{{inputs.parameters.image-tag}}
          - --destination=distopia-registry.distopia.svc.cluster.local:5000/distopia:latest
          - --build-arg=GIT_SHA={{inputs.parameters.short-sha}}
          - --insecure
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: registry-creds
            mountPath: /kaniko/.docker
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 8Gi
      volumes:
        - name: registry-creds
          secret:
            secretName: distopia-registry-pull
            items:
              - key: .dockerconfigjson
                path: config.json

    # 3a. Run the migration directly from the cloned source, before the image is built --
    #    not as an initContainer (so it can't accidentally run once per pod/replica), and
    #    before build-push specifically because infra-database's build step
    #    (`prisma generate --sql`) needs to introspect an already-migrated database.
    #    Installs its own node_modules straight onto the shared workspace volume; Kaniko's
    #    build context excludes node_modules (see .dockerignore) so this doesn't leak into
    #    the image, it's just this step's own throwaway install.
    - name: migrate
      container:
        image: oven/bun:1.4.0
        workingDir: /workspace/src
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            bun install --frozen-lockfile
            cd src/infrastructure/database
            bunx prisma migrate deploy
        env:
          - name: HUSKY
            value: "0"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: distopia-db-credentials
                key: url
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
