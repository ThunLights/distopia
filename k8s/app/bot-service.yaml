# Internal-only: distopia-app resolves this as distopia-bot:8083 (distopia-config's
# BOT_RPC_URL) and only the app pod may actually reach it, see bot-networkpolicy.yaml. Never
# wired to the Cloudflare Tunnel.
#
# Deliberately not pinning a clusterIP, same reasoning as service.yaml's own comment.
apiVersion: v1
kind: Service
metadata:
  name: distopia-bot
  namespace: distopia
spec:
  selector:
    app.kubernetes.io/name: distopia-bot
  ports:
    - name: rpc
      port: 8083
      targetPort: rpc
