# The distopia web app + Discord bot (single process -- see hooks.server.ts). The app reads
# all runtime config (BOT_TOKEN, PUBLIC_*, DATABASE_URL, ...) via $env/dynamic/* + dotenv
# (see hooks.server.ts) -- nothing is baked into the image at build time, so every value
# below is injected purely as a live env var at Pod start, sourced from k8s Secrets/
# ConfigMaps that are never part of the image or the in-cluster registry.
#
# replicas stays at 1: the app logs into the Discord gateway and runs in-process cron jobs
# itself (see k8s/README.md), so more than one instance running at once causes duplicate
# event handling. RollingUpdate with maxSurge:1/maxUnavailable:0 is still used (instead of
# Recreate) to get a zero-downtime rollout -- the brief window where the new pod is up
# alongside the old one during a rollout is accepted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distopia-app
  namespace: distopia
  labels:
    app.kubernetes.io/name: distopia-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: distopia-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distopia-app
    spec:
      # initContainers run once per new Pod (i.e. once per rollout, since replicas: 1 means
      # the still-running old Pod never restarts its own) -- prisma migrate deploy is
      # idempotent, so re-running it on a crash-loop restart is harmless, just redundant.
      # Runs from this same image (built by .github/workflows/deploy.yml) rather than a
      # separate clone+install, so the schema applied is always exactly what this image was
      # built against -- see infra-database's build step for why the schema must be current
      # *before* the image is built in the first place (prisma generate --sql introspects a
      # live database at build time, not just at migrate time).
      initContainers:
        - name: migrate
          image: ghcr.io/thunlights/distopia:latest
          workingDir: /app/src/infrastructure/database
          command: ["bunx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: distopia-db-credentials
                  key: url
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      containers:
        - name: distopia
          # This :latest is only the bootstrap fallback -- Argo CD Image Updater overrides
          # it with the actual deployed tag at the Application level (no git write-back).
          # See the annotations on k8s/argocd/app-app.yaml and k8s/README.md.
          image: ghcr.io/thunlights/distopia:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                # PORT (default "3000") -- @sveltejs/adapter-node reads this directly.
                # If you change it here, update `containerPort`/`service.yaml`'s
                # targetPort to match -- plain Kubernetes YAML can't cross-reference a
                # ConfigMap value into another field.
                name: distopia-config
            - secretRef:
                # BOT_TOKEN, BOT_SECRET, PUBLIC_*, SENTRY_* -- see k8s/README.md for the
                # kubectl create secret command.
                name: distopia-env
          env:
            # distopia-db-credentials carries a `url` key alongside the `username`/
            # `password` CloudNativePG's bootstrap.initdb.secret requires (k8s/db/
            # cluster.yaml) -- see k8s/README.md's secret-creation command for how it's
            # composed by hand, once, when the secret is created (not at runtime), so no
            # connection-string-shaped literal has to exist in this or any other manifest.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: distopia-db-credentials
                  key: url
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
