# The distopia web app. It no longer logs into the Discord gateway itself -- that moved to
# presentation-bot (see bot-deployment.yaml) -- but still reads all its own runtime config
# (PUBLIC_*, DATABASE_URL, ...) via $env/dynamic/* + dotenv (see hooks.server.ts) -- nothing
# is baked into the image at build time, so every value below is injected purely as a live
# env var at Pod start, sourced from k8s Secrets/ConfigMaps that are never part of the image
# or the in-cluster registry.
#
# replicas: 1 is just the default posture for a single-node cluster (see k8s/README.md's
# "Notes" section); nothing here depends on it. Every pod keeps its own read caches and
# refreshes them on schedulemanager's Redis Pub/Sub message (hooks.server.ts), cron jobs run only in
# distopia-schedulemanager, and all other state is in Postgres/Redis. RollingUpdate with
# maxSurge:1/maxUnavailable:0 keeps this zero-downtime.
#
# This pod is the *client* of both distopia-searchengine's internal RPC port
# (the Orama index moved out of this process -- see app-core's remote.ts and
# searchengine-deployment.yaml) and distopia-bot's (the live Discord guild/member/channel
# cache moved out of this process too -- see app-core's remote.ts and
# bot-deployment.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distopia-app
  namespace: distopia
  labels:
    app.kubernetes.io/name: distopia-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: distopia-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distopia-app
    spec:
      # oven/bun's non-root `bun` user (uid/gid 1000), matching docker/dockerfile.prod's USER.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # initContainers run once per new Pod -- prisma migrate deploy is idempotent and takes
      # an advisory lock, so re-running it per replica or on a crash-loop restart is harmless,
      # just redundant.
      # Runs from this same image (built by .github/workflows/deploy.yml) rather than a
      # separate clone+install, so the schema applied is always exactly what this image was
      # built against -- see infra-database's build step for why the schema must be current
      # *before* the image is built in the first place (prisma generate --sql introspects a
      # live database at build time, not just at migrate time).
      initContainers:
        - name: migrate
          image: ghcr.io/studio-distopia/distopia:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          workingDir: /app/src/infrastructure/database
          command: ["bunx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: distopia-db-credentials
                  key: url
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      containers:
        - name: distopia
          # This :latest is only the bootstrap fallback -- Argo CD Image Updater overrides
          # it with the actual deployed tag at the Application level (no git write-back).
          # See the annotations on k8s/argocd/app-app.yaml and k8s/README.md.
          image: ghcr.io/studio-distopia/distopia:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                # PORT (default "3000"), read directly by @sveltejs/adapter-node, plus
                # SEARCHENGINE_RPC_URL/BOT_RPC_URL, the addresses app-core's remote.ts calls.
                # If you change PORT, update the matching `containerPort` above and
                # `service.yaml`'s targetPort to match -- plain Kubernetes YAML can't
                # cross-reference a ConfigMap value into another field.
                name: distopia-config
            - secretRef:
                # BOT_TOKEN, BOT_SECRET, PUBLIC_*, SENTRY_*, BOT_RPC_TOKEN,
                # SEARCHENGINE_RPC_TOKEN -- see k8s/README.md for the kubectl create secret
                # command.
                name: distopia-env
          env:
            # distopia-db-credentials carries a `url` key alongside the `username`/
            # `password` CloudNativePG's bootstrap.initdb.secret requires (k8s/db/
            # cluster.yaml) -- see k8s/README.md's secret-creation command for how it's
            # composed by hand, once, when the secret is created (not at runtime), so no
            # connection-string-shaped literal has to exist in this or any other manifest.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: distopia-db-credentials
                  key: url
          # /healthz never touches the DB or the bot RPC: probing `/` (which refreshes the
          # guild list) timed out whenever those were slow and got a healthy pod restarted.
          # hooks.server.ts finishes start() (cache warm-up) before it listens, so the
          # startupProbe gives boot up to 5 minutes before liveness takes over.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
