# No `images:` override here on purpose -- deployment.yaml's own image field (currently
# `:latest`) is the bootstrap fallback. Argo CD Image Updater (see the annotations on
# k8s/argocd/app-app.yaml) patches the actual running tag into that Application's
# `spec.source.kustomize.images` directly, in the cluster, never by editing this file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- configmap.yaml
- deployment.yaml
- service.yaml
- schedulemanager-deployment.yaml
- schedulemanager-networkpolicy.yaml
- searchengine-deployment.yaml
- searchengine-service.yaml
- searchengine-networkpolicy.yaml
- bot-deployment.yaml
- bot-service.yaml
- bot-networkpolicy.yaml
