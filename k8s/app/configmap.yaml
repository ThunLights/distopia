# Non-secret runtime config. Equivalent to the old docker/.env's PROD_PORT -- change the
# value here (and containerPort/service.yaml's targetPort to match) to move the app off
# port 3000.
#
# REDIS_URL has no credentials in it (see k8s/redis/redis.yaml -- no AUTH configured),
# which is why it lives here rather than in the distopia-env Secret.
#
# SCHEDULEMANAGER_RPC_PORT is the internal-only Connect RPC port presentation-schedulemanager
# calls into (see schedulemanager-deployment.yaml/schedulemanager-networkpolicy.yaml) -- not
# secret (the NetworkPolicy + SCHEDULEMANAGER_RPC_TOKEN, in distopia-env, are what actually
# gate access), so it's fine alongside PORT here. Change it here (and containerPort/
# service.yaml's `rpc` entry, plus schedulemanager-deployment.yaml's SCHEDULEMANAGER_RPC_URL)
# together.
#
# SEARCHENGINE_RPC_PORT/SEARCHENGINE_RPC_URL are the same arrangement with the direction
# reversed: presentation-searchengine serves that port and distopia-app (and now
# distopia-bot too, for its own guild-profile-editing commands) calls it (see
# searchengine-deployment.yaml/searchengine-networkpolicy.yaml). Both the port and the
# in-cluster URL live here because every pod that needs them reads this ConfigMap; change
# them together with searchengine-deployment.yaml's containerPort and
# searchengine-service.yaml's `rpc` port.
#
# BOT_RPC_PORT/BOT_RPC_URL mirror that same arrangement again, direction reversed once more:
# presentation-bot serves that port (it owns the one real, logged-in discord.js Client) and
# distopia-app calls it (see bot-deployment.yaml/bot-networkpolicy.yaml and
# src/presentation/web/src/lib/server/discord.ts). Change them together with
# bot-deployment.yaml's containerPort and bot-service.yaml's `rpc` port.
apiVersion: v1
kind: ConfigMap
metadata:
  name: distopia-config
  namespace: distopia
data:
  PORT: "3000"
  REDIS_URL: "redis://distopia-redis.distopia.svc.cluster.local:6379"
  SCHEDULEMANAGER_RPC_PORT: "8081"
  SEARCHENGINE_RPC_PORT: "8082"
  SEARCHENGINE_RPC_URL: "http://distopia-searchengine:8082"
  BOT_RPC_PORT: "8083"
  BOT_RPC_URL: "http://distopia-bot:8083"
