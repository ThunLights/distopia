# Defense-in-depth alongside the BOT_RPC_TOKEN bearer check
# (src/presentation/bot/src/server/rpc.ts): the bot pod serves nothing public, so its only
# ingress rule is "the app pod, on the rpc port" -- selecting the pod at all switches it to
# default-deny for everything else. Mirrors searchengine-networkpolicy.yaml exactly (same
# direction: distopia-app is the client, this pod is the server).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: distopia-bot-allow-app-rpc
  namespace: distopia
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: distopia-bot
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: rpc
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: distopia-app
