# presentation-schedulemanager: runs every cron job itself, against the database and Redis
# directly and Discord/search through distopia-bot's and distopia-searchengine's RPCs (as
# distopia-app does). It never calls distopia-app, and never receives inbound traffic itself,
# so it has no Service of its own.
#
# replicas stays at 1 (see k8s/README.md): a second replica would run every job twice. Recreate (not
# RollingUpdate) for the same reason -- RollingUpdate's maxSurge:1 would let the new pod
# start ticking before the old one stops, which is exactly the double-fire this Deployment
# otherwise avoids. Unlike distopia-app, a brief gap in scheduling during a rollout is fine
# here: it just means one tick is skipped, not a dropped request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distopia-schedulemanager
  namespace: distopia
  labels:
    app.kubernetes.io/name: distopia-schedulemanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: distopia-schedulemanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distopia-schedulemanager
    spec:
      # oven/bun's non-root `bun` user (uid/gid 1000), matching docker/dockerfile.prod's USER.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: distopia-schedulemanager
          # Same image as distopia-app (see deployment.yaml's own comment on the :latest
          # bootstrap fallback + Argo CD Image Updater) -- `bun run build` already builds
          # every workspace package into it, so this just overrides the start command.
          image: ghcr.io/thunlights/distopia:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["bun", "run", "src/presentation/schedulemanager/src/index.ts"]
          workingDir: /app
          envFrom:
            # REDIS_URL, SEARCHENGINE_RPC_URL, BOT_RPC_URL from distopia-config; BOT_TOKEN,
            # BOT_SECRET, PUBLIC_*, BOT_RPC_TOKEN, SEARCHENGINE_RPC_TOKEN from distopia-env.
            - configMapRef:
                name: distopia-config
            - secretRef:
                name: distopia-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: distopia-db-credentials
                  key: url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
