# Defense-in-depth alongside VERIFY_RPC_TOKEN's bearer check (enforced by whatever private
# VerifyService implementation you run -- see verify-deployment.yaml): this pod should serve
# nothing public, so its only ingress rule is "the app pod, on the rpc port." Mirrors
# bot-networkpolicy.yaml/searchengine-networkpolicy.yaml exactly (same direction: distopia-app
# is the client, this pod is the server).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: distopia-verify-allow-app-rpc
  namespace: distopia
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: distopia-verify
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: rpc
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: distopia-app
