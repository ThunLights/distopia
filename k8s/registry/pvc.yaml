apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: distopia-registry-data
  namespace: distopia
spec:
  accessModes:
    - ReadWriteOnce
  # TODO: confirm this matches a StorageClass that exists on your k3s cluster.
  # k3s ships "local-path" by default.
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
