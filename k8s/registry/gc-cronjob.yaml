# Nothing else here ever deletes an image -- every push to main adds a new
# "<committer-epoch>-<short-sha>" tag (see k8s/ci/workflowtemplate.yaml) and the registry's
# 20Gi PVC (see pvc.yaml) has no retention policy of its own, so it grows without bound.
# This CronJob is that retention policy: keep the newest KEEP_COUNT build tags, delete the
# rest, then run online garbage collection to actually reclaim the disk space (deleting a
# manifest alone only unreferences it -- the blobs stay on disk until GC sweeps them).
#
# Never deletes the tag distopia-app is *currently* running, even if it's outside the
# KEEP_COUNT window -- kubelet only skips re-pulling a tag it already has cached locally, so
# deleting that exact tag from the registry would silently break the next time this single
# node needs to re-pull it (a reboot, an evicted image cache, a manual rollout restart).
#
# Assumes registry:2's online garbage collection (supported since distribution v2.7, the
# default for years now) -- deleting manifests and running `garbage-collect` while the
# registry keeps serving reads/writes is safe on that version. Re-verify if you ever pin an
# older registry image explicitly (deployment.yaml currently doesn't pin a version at all).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: distopia-registry-gc-sa
  namespace: distopia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: distopia-registry-gc-role
  namespace: distopia
rules:
  # Only used to read distopia-app's currently-deployed image tag (see "get-current-tag"
  # below) -- never modifies it.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  # `kubectl exec deploy/distopia-registry` resolves the Deployment to a live Pod first (the
  # "get" above covers that), then execs into it -- namespace-scoped, not pinned to the
  # registry's exact Pod name since that name is regenerated by its ReplicaSet on every
  # rollout. This does technically let the SA exec into any Pod in the namespace, not just
  # the registry one; matches the same namespace-wide (not per-Pod) granularity already
  # accepted for distopia-workflow-sa above rather than engineering dynamic Pod-name binding.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: distopia-registry-gc-rolebinding
  namespace: distopia
subjects:
  - kind: ServiceAccount
    name: distopia-registry-gc-sa
    namespace: distopia
roleRef:
  kind: Role
  name: distopia-registry-gc-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: distopia-registry-gc
  namespace: distopia
spec:
  # Adjust to your own timezone/preference -- UTC by default (no `timeZone` field set).
  schedule: "0 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: distopia-registry-gc-sa
          restartPolicy: Never
          # 1. Resolve distopia-app's live image tag first so step 2 can exclude it, no
          #    matter how old it is relative to KEEP_COUNT.
          initContainers:
            # alpine/k8s (not the minimal rancher/kubectl used below) because this step
            # needs a real shell for the pipe/sed/redirect -- confirmed live: rancher/kubectl
            # is a bare static binary with no /bin/sh at all, so `command: ["sh", "-c"]`
            # against it fails outright ("exec: sh: executable file not found in $PATH").
            - name: get-current-tag
              image: alpine/k8s:1.34.9
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  kubectl get deployment distopia-app -n distopia \
                    -o jsonpath='{.spec.template.spec.containers[0].image}' \
                    | sed 's#.*:##' > /shared/current-tag
                  echo "currently deployed tag: $(cat /shared/current-tag)"
              volumeMounts:
                - name: shared
                  mountPath: /shared
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 64Mi
            # 2. Delete every build tag outside the retention window, skipping the
            #    currently-deployed one from step 1. Only unreferences the manifests --
            #    step 3 (the main container) is what actually reclaims disk space.
            - name: delete-old-tags
              image: curlimages/curl:8.11.1
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  registry_url="http://distopia-registry.distopia.svc.cluster.local:5000"
                  repo="distopia"
                  current_tag="$(cat /shared/current-tag)"
                  auth="$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')"

                  # Only the epoch-prefixed build tags (see workflowtemplate.yaml's `clone`
                  # step) -- excludes "latest", which is a moving alias, not a retainable
                  # build. Alphabetical == chronological order here, the same assumption
                  # Argo CD Image Updater's own `alphabetical` update-strategy relies on
                  # (see k8s/argocd/app-app.yaml).
                  all_tags="$(curl -sf -H "Authorization: Basic ${auth}" \
                    "${registry_url}/v2/${repo}/tags/list" \
                    | grep -o '"[0-9]\{10\}-[0-9a-f]\{7,10\}"' | tr -d '"' | sort)"
                  keep_tags="$(printf '%s\n' "$all_tags" | tail -n "${KEEP_COUNT}")"

                  for tag in $all_tags; do
                    if printf '%s\n' "$keep_tags" | grep -qx "$tag"; then
                      continue
                    fi
                    if [ "$tag" = "$current_tag" ]; then
                      echo "skipping ${tag}: currently deployed"
                      continue
                    fi

                    digest="$(curl -sf -I \
                      -H "Authorization: Basic ${auth}" \
                      -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                      "${registry_url}/v2/${repo}/manifests/${tag}" \
                      | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2}')"
                    if [ -z "$digest" ]; then
                      echo "warn: could not resolve digest for ${tag}, skipping" >&2
                      continue
                    fi

                    echo "deleting ${repo}:${tag} (${digest})"
                    curl -sf -X DELETE -H "Authorization: Basic ${auth}" \
                      "${registry_url}/v2/${repo}/manifests/${digest}" \
                      || echo "warn: failed to delete ${repo}:${tag}" >&2
                  done
              env:
                - name: KEEP_COUNT
                  value: "10"
                - name: REGISTRY_USER
                  valueFrom:
                    secretKeyRef:
                      name: distopia-registry-credentials
                      key: username
                - name: REGISTRY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: distopia-registry-credentials
                      key: password
              volumeMounts:
                - name: shared
                  mountPath: /shared
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
          # 3. Actually reclaim disk space for everything step 2 unreferenced. A single
          #    kubectl invocation, no shell needed -- rancher/kubectl (a bare static binary,
          #    smaller than alpine/k8s) is deliberately used here instead, with `command`
          #    set directly rather than wrapped in `sh -c`.
          containers:
            - name: gc
              image: rancher/kubectl:v1.34.9
              command:
                - kubectl
                - exec
                - deploy/distopia-registry
                - -n
                - distopia
                - --
                - registry
                - garbage-collect
                - /etc/docker/registry/config.yml
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: shared
              emptyDir: {}
